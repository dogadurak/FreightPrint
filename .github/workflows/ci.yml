# The suite is hermetic — conftest fails any test that reaches the network — so this
# needs no OSRM, no Nominatim, and no secrets. That is the property that makes it worth
# running: a green tick here means the engine is correct, not that a third party was up.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Customer data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Runs before the tests: if customer data has been committed, that is the finding,
      # and a passing suite underneath it would only bury the message.
      - name: No sensitive file may be tracked
        run: python scripts/check_tracked_files.py

      # A field parsed and then read by nothing is this project's most repeated defect:
      # the honesty in data/ reaches nobody, and the file's promise goes unkept. Cheap to
      # run and it has already caught three.
      - name: Every field in data/ is used or excused in writing
        run: python scripts/check_data_fields.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # The notebook stack is a development convenience and pulls a large tree; the
      # engine and its tests do not import it.
      - name: Install
        run: |
          grep -v -E '^(matplotlib|jupyter|nbconvert)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      # A JavaScript error at module scope disables every control on the page and
      # reports itself only to a console nobody has open, so no Python test can see it.
      # ubuntu-latest ships node, which means this is never the skipped one.
      - name: Dashboard script loads
        run: node scripts/check_frontend_boots.js

      # Lane keys, carrier names and place names all come out of an uploaded file.
      - name: Text from uploaded files is escaped
        run: node scripts/check_escaping.js

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q -ra

  image:
    name: Image builds
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      # Built but not pushed: this catches a Dockerfile that stopped working, which is
      # otherwise only discovered at deployment time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: freightprint:ci

      - name: Container answers /health
        run: |
          docker run -d --name freightprint -p 8000:8000 freightprint:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "\nup after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "did not become healthy"; docker logs freightprint; exit 1
